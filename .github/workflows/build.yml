name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: |
          go vet ./...
          go tool mygo vet .

  package:
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-latest
            platform: windows/amd64
            artifact_glob: build/windows-amd64/nextai-translator-native-setup-*.exe
          - os: windows
            arch: arm64
            runner: windows-latest
            platform: windows/arm64
            artifact_glob: build/windows-arm64/nextai-translator-native-setup-*.exe
          - os: darwin
            arch: amd64
            runner: macos-latest
            platform: darwin/amd64
            artifact_glob: build/darwin-amd64/*.dmg
          - os: darwin
            arch: arm64
            runner: macos-latest
            platform: darwin/arm64
            artifact_glob: build/darwin-arm64/*.dmg
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            artifact_glob: |
              build/linux-amd64/*.deb
              build/linux-amd64/*.tar.gz
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            platform: linux/arm64
            artifact_glob: |
              build/linux-arm64/*.deb
              build/linux-arm64/*.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build installer (${{ matrix.platform }})
        run: go tool mygo build -platform ${{ matrix.platform }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
